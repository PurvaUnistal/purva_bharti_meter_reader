plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}


def keystoreProperties = new Properties()


android {
    namespace "com"
    compileSdkVersion 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
    }

    flavorDimensions "app"
    productFlavors {
        prodPBGPL {
            dimension "app"
            applicationIdSuffix ".unistal.pbg.meter_reader"
            resValue "string", "app_name", "PBGPL Meter Reader"
            manifestPlaceholders = [
                    appIcon: "@mipmap/pbg_logo",
                    appIconRound: "@mipmap/pbg_logo"
            ]
            versionCode 17
            versionName "2.0.9-PBGPL"
            def keystorePropertiesFile = rootProject.file('key.properties')
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }
        }
        prodMGL {
            dimension "app"
            applicationIdSuffix ".unistal.mgl.meter_reader"
            resValue "string", "app_name", "MGL Meter Reader"
            manifestPlaceholders = [
                    appIcon: "@mipmap/mgl_logo",
                    appIconRound: "@mipmap/mgl_logo"
            ]
            versionCode 3
            versionName "1.0.1-MGL"
        }
        prodHNGPL {
            dimension "app"
            applicationIdSuffix ".unistal.hngpl.meter_reader"
            resValue "string", "app_name", "HNGPL Meter Reader"
            manifestPlaceholders = [
                    appIcon: "@mipmap/hngpl_logo",
                    appIconRound: "@mipmap/hngpl_logo"
            ]
            versionCode 01
            versionName "1.0.0-HNGPL"
        }
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.release
            minifyEnabled true // Enables code shrinking and obfuscation
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

        }
    }
    packagingOptions {
        exclude 'META-INF/proguard/androidx-annotations.pro'
        exclude 'META-INF/proguard/coroutines.pro'
    }
}

flutter {
    source = "../.."
}
dependencies {
    implementation("com.google.android.play:app-update:2.1.0")
    implementation("com.google.android.play:app-update-ktx:2.1.0")
}

